<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>BJJ Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <div id="app">

        <!-- 대시보드 -->
        <div id="screen-dashboard" class="screen active">
            <div class="dash-header">
                <div id="dash-date"></div>
                <div id="dash-time"></div>
            </div>
            <div id="schedule-badge" class="hidden">
                <span id="schedule-text"></span>
            </div>
            <div class="dash-label">프리셋</div>
            <div id="preset-list"></div>
            <div class="dash-bottom">
                <button id="btn-add-preset" class="btn-add">+ 새 프리셋</button>
                <button id="btn-app-settings" class="btn-settings-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                </button>
            </div>
        </div>

        <!-- 타이머 -->
        <div id="screen-timer" class="screen">
            <div id="timer-top">
                <button id="btn-back" class="btn-back">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <span id="timer-preset-name"></span>
            </div>
            <div id="timer-bar-top"><div id="timer-bar-top-fill"></div></div>
            <div id="timer-body">
                <div id="countdown" class="two-line">
                    <div id="cd-min-line">5분</div>
                    <div id="cd-sec-line">00</div>
                </div>
            </div>
            <div id="timer-bar-wrap">
                <div id="timer-bar"><div id="timer-bar-fill"></div></div>
                <div id="timer-bar-labels">
                    <span id="timer-bar-elapsed">0:00</span>
                    <span id="timer-bar-total">5:00</span>
                </div>
            </div>
            <div id="timer-controls">
                <button id="btn-reset" class="btn-ctrl">리셋</button>
                <button id="btn-start" class="btn-ctrl-primary">시작</button>
            </div>
        </div>

        <!-- 프리셋 편집 -->
        <div id="screen-preset-edit" class="screen">
            <div class="sheet-header">
                <button class="btn-back" data-close="1">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <h2 id="preset-edit-title">프리셋 추가</h2>
                <button id="btn-save-preset" class="btn-save">저장</button>
            </div>
            <div class="sheet-body">
                <div class="form-group">
                    <label class="form-label">이름</label>
                    <input type="text" id="pe-name" class="form-input" placeholder="예: 기본 스파링">
                </div>
                <div class="form-group">
                    <label class="form-label">스파링 시간</label>
                    <div class="time-picker">
                        <div class="time-unit">
                            <input type="number" id="pe-round-min" min="0" max="99" value="5" class="time-num">
                            <span class="time-suffix">분</span>
                        </div>
                        <div class="time-unit">
                            <input type="number" id="pe-round-sec" min="0" max="59" value="0" class="time-num">
                            <span class="time-suffix">초</span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">휴식 시간</label>
                    <div class="time-picker">
                        <div class="time-unit">
                            <input type="number" id="pe-rest-min" min="0" max="99" value="1" class="time-num">
                            <span class="time-suffix">분</span>
                        </div>
                        <div class="time-unit">
                            <input type="number" id="pe-rest-sec" min="0" max="59" value="0" class="time-num">
                            <span class="time-suffix">초</span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">종료 카운트다운</label>
                    <div class="stepper">
                        <button class="stepper-btn" data-target="pe-warning" data-delta="-5">&minus;</button>
                        <input type="number" id="pe-warning" min="0" max="30" value="10" class="stepper-val">
                        <button class="stepper-btn" data-target="pe-warning" data-delta="5">+</button>
                        <span class="stepper-suffix">초 전</span>
                    </div>
                </div>
                <button id="btn-delete-preset" class="btn-danger hidden">이 프리셋 삭제</button>
            </div>
        </div>

        <!-- 앱 설정 -->
        <div id="screen-settings" class="screen">
            <div class="sheet-header">
                <button class="btn-back" data-close="1">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <h2>설정</h2>
                <button id="btn-save-app-settings" class="btn-save">저장</button>
            </div>
            <div class="sheet-body">
                <div class="form-section">운영 스케줄</div>
                <div class="form-row">
                    <span>스케줄 사용</span>
                    <label class="toggle"><input type="checkbox" id="as-enabled"><span class="toggle-track"></span></label>
                </div>
                <div class="form-row">
                    <span>시작</span>
                    <input type="time" id="as-start" value="18:00" class="form-time">
                </div>
                <div class="form-row">
                    <span>종료</span>
                    <input type="time" id="as-end" value="22:00" class="form-time">
                </div>
                <div class="form-divider"></div>
                <div class="form-section">벨소리</div>
                <div id="bell-selector" class="bell-selector">
                    <label class="bell-opt"><input type="radio" name="bell-type" value="1" checked><span>삐</span></label>
                    <label class="bell-opt"><input type="radio" name="bell-type" value="2"><span>부저</span></label>
                    <label class="bell-opt"><input type="radio" name="bell-type" value="3"><span>삑삑</span></label>
                    <label class="bell-opt"><input type="radio" name="bell-type" value="4"><span>벨</span></label>
                    <label class="bell-opt"><input type="radio" name="bell-type" value="5"><span>삐──</span></label>
                    <label class="bell-opt"><input type="radio" name="bell-type" value="6"><span>삐삐빅</span></label>
                    <label class="bell-opt"><input type="radio" name="bell-type" value="7"><span>삐빅삐빅</span></label>
                </div>
                <div class="form-row">
                    <span>벨소리 테스트</span>
                    <button id="btn-test-sound" class="btn-small">재생</button>
                </div>
                <div class="form-divider"></div>
                <div class="form-section">소리 · 진동</div>
                <div class="form-row">
                    <span>효과음</span>
                    <label class="toggle"><input type="checkbox" id="as-sound" checked><span class="toggle-track"></span></label>
                </div>
                <div class="form-row">
                    <span>벨 음량</span>
                    <input type="range" id="as-volume" min="0" max="100" value="80" class="range-slider">
                </div>
                <div class="form-row">
                    <span>배경음악</span>
                    <input type="range" id="as-music-volume" min="0" max="100" value="50" class="range-slider">
                </div>
                <div class="form-row">
                    <span>진동</span>
                    <label class="toggle"><input type="checkbox" id="as-vibrate" checked><span class="toggle-track"></span></label>
                </div>
            </div>
        </div>
    </div>

    <script src="js/settings.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/app.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
    }
    </script>
</body>
</html>
