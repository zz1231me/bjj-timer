<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>BJJ Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <!-- 대시보드 화면 -->
        <div id="screen-dashboard" class="screen active">
            <div class="dash-header">
                <div id="dash-date"></div>
                <div id="dash-time"></div>
            </div>
            <div id="schedule-badge" class="hidden">
                <span id="schedule-text"></span>
            </div>
            <div class="dash-title">타이머 프리셋</div>
            <div id="preset-list"></div>
            <div class="dash-footer">
                <button id="btn-add-preset" class="footer-btn">+ 프리셋 추가</button>
                <button id="btn-app-settings" class="footer-btn icon-btn">&#9881;</button>
            </div>
        </div>

        <!-- 타이머 화면 -->
        <div id="screen-timer" class="screen">
            <button id="btn-back" class="back-btn">&larr; 돌아가기</button>
            <div id="timer-preset-name"></div>
            <div id="round-info">
                라운드 <span id="round-current">1</span> / <span id="round-total">5</span>
            </div>
            <div id="status-label">준비</div>
            <div id="countdown">5:00</div>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="timer-controls">
                <button id="btn-reset" class="ctrl-btn">리셋</button>
                <button id="btn-start" class="ctrl-btn primary">시작</button>
            </div>
        </div>

        <!-- 프리셋 편집 모달 -->
        <div id="screen-preset-edit" class="screen">
            <div class="modal-header">
                <h2 id="preset-edit-title">프리셋 추가</h2>
                <button class="close-btn" data-close="preset-edit">&times;</button>
            </div>
            <div class="modal-body">
                <div class="field">
                    <label>이름</label>
                    <input type="text" id="pe-name" placeholder="예: 기본 스파링">
                </div>
                <div class="field">
                    <label>스파링 시간</label>
                    <div class="time-input">
                        <input type="number" id="pe-round-min" min="0" max="99" value="5">
                        <span class="colon">분</span>
                        <input type="number" id="pe-round-sec" min="0" max="59" value="0">
                        <span class="colon">초</span>
                    </div>
                </div>
                <div class="field">
                    <label>휴식 시간</label>
                    <div class="time-input">
                        <input type="number" id="pe-rest-min" min="0" max="99" value="1">
                        <span class="colon">분</span>
                        <input type="number" id="pe-rest-sec" min="0" max="59" value="0">
                        <span class="colon">초</span>
                    </div>
                </div>
                <div class="field">
                    <label>라운드 수</label>
                    <div class="number-input">
                        <button class="adj-btn" data-target="pe-rounds" data-delta="-1">&minus;</button>
                        <input type="number" id="pe-rounds" min="1" max="99" value="5">
                        <button class="adj-btn" data-target="pe-rounds" data-delta="1">+</button>
                    </div>
                </div>
                <div class="field">
                    <label>경고 (초 전)</label>
                    <div class="number-input">
                        <button class="adj-btn" data-target="pe-warning" data-delta="-5">&minus;</button>
                        <input type="number" id="pe-warning" min="0" max="60" value="10">
                        <button class="adj-btn" data-target="pe-warning" data-delta="5">+</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-delete-preset" class="delete-btn hidden">삭제</button>
                <button id="btn-save-preset" class="save-btn">저장</button>
            </div>
        </div>

        <!-- 앱 설정 화면 -->
        <div id="screen-settings" class="screen">
            <div class="modal-header">
                <h2>앱 설정</h2>
                <button class="close-btn" data-close="settings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="section-title">자동 켜짐/꺼짐</div>
                <div class="field toggle-field">
                    <label>스케줄 사용</label>
                    <label class="switch">
                        <input type="checkbox" id="as-enabled">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="field">
                    <label>시작 시간</label>
                    <input type="time" id="as-start" value="18:00">
                </div>
                <div class="field">
                    <label>종료 시간</label>
                    <input type="time" id="as-end" value="22:00">
                </div>
                <div class="divider"></div>
                <div class="section-title">소리</div>
                <div class="field toggle-field">
                    <label>소리</label>
                    <label class="switch">
                        <input type="checkbox" id="as-sound" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="field">
                    <label>음량</label>
                    <input type="range" id="as-volume" min="0" max="100" value="80" class="volume-slider">
                </div>
                <div class="field toggle-field">
                    <label>진동</label>
                    <label class="switch">
                        <input type="checkbox" id="as-vibrate" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="field">
                    <label>벨소리 테스트</label>
                    <button id="btn-test-sound" class="test-btn">&#9654; 재생</button>
                </div>
            </div>
            <button id="btn-save-app-settings" class="save-btn">저장</button>
        </div>

    </div>

    <script src="js/settings.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
